# freqtrade — หนึ่ง service ต่อ timeframe (แผนเฟส 3)
#   docker compose up -d                 → รัน ft-1h
#   (ft-4h ถูกถอดออก: สองกลยุทธ์ที่มันเทรด cm_macd / squeeze_momentum ถูกลบตามคำขอของผู้ใช้)
#   docker compose run --rm freqtrade …  → คำสั่งครั้งเดียว (backtesting, download-data, list-strategies)
#
# พอร์ต REST API ผูกกับ 127.0.0.1 เท่านั้น เข้าจากภายนอกผ่าน SSH tunnel หรือ reverse proxy ที่มี TLS
services:
  ft-1h:
    image: freqtradeorg/freqtrade:stable
    container_name: ft-1h
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/ft-1h.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/config.1h.json
      --strategy BaseSignalStrategy


  # service สำหรับคำสั่งครั้งเดียว ไม่ถูกสตาร์ทโดย `up`
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    profiles: ["tools"]
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./fixtures:/fixtures:ro
    command: --help

  # FreqUI โหมด backtest (webserver) — เปิด http://127.0.0.1:8082 แล้วใช้แท็บ Backtesting
  #   docker compose up -d ft-web
  ft-web:
    image: freqtradeorg/freqtrade:stable
    container_name: ft-web
    profiles: ["web"]
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8082:8080"
    command: >
      webserver
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/config.web.json
